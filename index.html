<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Dev Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow border-0"><div class="card-body p-4">
        <h1 class="h3 mb-3">Web Dev Quiz</h1>
        <div class="progress mb-3"><div id="progress" class="progress-bar"></div></div>

        <div id="quiz">
          <p class="text-muted mb-1" id="count"></p>
          <h2 class="h5 mb-3" id="question"></h2>
          <div id="options"></div>
          <button class="btn btn-primary mt-2" id="next">Next</button>
        </div>

        <div id="result" class="text-center" style="display:none">
          <p class="mb-1">Your score</p>
          <p class="display-4 fw-bold" id="score"></p>
          <p id="msg"></p>
          <button class="btn btn-primary" id="restart">Try again</button>
        </div>
      </div></div>
    </div></div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
